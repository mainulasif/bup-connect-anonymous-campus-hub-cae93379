<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="32" fill="#713f12"/>
  <!-- wings -->
  <path d="M10 34 Q8 18 18 14 L22 22 L18 28 L22 32 Z" fill="#eab308" opacity="0.8"/>
  <path d="M54 34 Q56 18 46 14 L42 22 L46 28 L42 32 Z" fill="#eab308" opacity="0.8"/>
  <!-- lion body -->
  <ellipse cx="32" cy="44" rx="16" ry="12" fill="#ca8a04"/>
  <ellipse cx="32" cy="42" rx="12" ry="10" fill="#eab308"/>
  <!-- head -->
  <circle cx="32" cy="24" r="12" fill="#ca8a04"/>
  <circle cx="32" cy="23" r="10" fill="#eab308"/>
  <!-- feathered ears -->
  <polygon points="20,18 16,6 26,14" fill="#fbbf24"/>
  <polygon points="44,18 48,6 38,14" fill="#fbbf24"/>
  <!-- eyes -->
  <circle cx="27" cy="22" r="3" fill="white"/>
  <circle cx="37" cy="22" r="3" fill="white"/>
  <circle cx="28" cy="22" r="2" fill="#92400e"/>
  <circle cx="38" cy="22" r="2" fill="#92400e"/>
  <circle cx="28.5" cy="21" r="0.8" fill="white"/>
  <circle cx="38.5" cy="21" r="0.8" fill="white"/>
  <!-- beak -->
  <polygon points="29,27 32,33 35,27" fill="#f59e0b"/>
  <line x1="29" y1="27" x2="35" y2="27" stroke="#d97706" stroke-width="1"/>
  <!-- claws -->
  <path d="M20 52 L18 56 M22 52 L20 56 M24 52 L22 56" stroke="#92400e" stroke-width="1.5"/>
  <path d="M40 52 L42 56 M42 52 L44 56 M44 52 L46 56" stroke="#92400e" stroke-width="1.5"/>
</svg>